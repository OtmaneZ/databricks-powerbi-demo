# Single Lakeflow pipeline bronze -> silver -> gold (+ ops quarantine), in SQL.
# Free Edition allows one active pipeline per type, hence a single pipeline.
# Datasets use fully qualified names ${catalog}.<schema>.<table>; schemas, security table,
# row filter and masks are created beforehand by sql/governance (00_setup, 10_security).
resources:
  pipelines:
    dec_demo_etl:
      name: dec_demo_etl
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      root_path: ../src/dec_demo_etl
      libraries:
        - glob:
            include: ../src/dec_demo_etl/transformations/**
      configuration:
        catalog: ${var.catalog}
        landing_path: /Volumes/${var.catalog}/bronze/landing
