default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run sqlfluff lint
        language: system
        types: [sql]
      - id: powerbi-checks
        name: Power BI checks (JSON schemas, bindings, model rules, layout)
        entry: bash -c 'uv run python scripts/check_schemas.py && uv run python scripts/check_bindings.py && uv run python scripts/check_model.py && uv run python scripts/check_layout.py'
        language: system
        files: ^(powerbi/|scripts/)
        pass_filenames: false
      - id: no-dashes
        name: no em or en dash in tracked text files
        entry: uv run python scripts/check_texts.py
        language: system
        pass_filenames: false
        always_run: true
      - id: no-private-files
        name: block _private/ from commits
        entry: bash -c 'echo "_private/ must never be committed"; exit 1'
        language: system
        files: ^_private/
      - id: no-co-authors
        name: block Co-authored-by trailers (single-author repo)
        entry: bash -c 'if grep -qiE "^co-authored-by:|generated with" "$1"; then echo "Co-authored-by trailers and generated-with mentions are not allowed in this repo"; exit 1; fi' --
        language: system
        stages: [commit-msg]
