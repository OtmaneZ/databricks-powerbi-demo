[project]
name = "dec_demo"
version = "0.1.0"
description = "Demo: Databricks (Unity Catalog, Lakeflow) + Power BI data platform for a DIY retail Data Expertise Centre. Fictitious data."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Runtime deps for jobs/wheel. For pipelines, also declare them in resources/*.pipeline.yml `environment`.
]

[project.scripts]
dec-generate = "dec_demo.generate:main"
dec-governance = "dec_demo.governance:main"

[dependency-groups]
dev = [
    "databricks-connect>=18.3,<18.4",  # = serverless environment_version 5 (Python 3.12.3)
    "databricks-dlt",
    "pytest",
    "ruff",
    "sqlfluff",
    "pre-commit",
    "ipykernel",
    "faker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dec_demo"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
